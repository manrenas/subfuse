name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64 AppImage
            os: ubuntu-24.04
            target: linux
          - name: Windows x86_64 ZIP
            os: windows-2022
            target: windows
          - name: macOS Apple Silicon ZIP
            os: macos-15
            target: macos
          - name: macOS Intel ZIP
            os: macos-15-intel
            target: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Check release tag version
        shell: bash
        run: |
          python - <<'PY'
          import os
          import re
          from legenda_app import __version__
          tag = os.environ["GITHUB_REF_NAME"]
          if not re.fullmatch(r"v\d+\.\d+\.\d+", tag) or tag[1:] != __version__:
              raise SystemExit(f"Tag {tag!r} must match project version {__version__!r}")
          PY
      - name: Install build dependencies
        run: python -m pip install ".[build]"
      - name: Install AppImage tooling
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libfuse2
          curl --fail --location --retry 3 \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage \
            --output /tmp/appimagetool
          echo "e8c1169c4af66c3184d7ee110713d4be04befe671fa358e2c1591ee840553b03  /tmp/appimagetool" \
            | sha256sum --check
          chmod +x /tmp/appimagetool
          echo "/tmp" >> "$GITHUB_PATH"
          curl --fail --location --retry 3 \
            https://github.com/AppImage/type2-runtime/releases/download/continuous/runtime-x86_64 \
            --output /tmp/runtime-x86_64
          echo "617aa77314d57c8b8e4fae9c3f0b35af7b30d5529cb69e98f64f92510ed98a46  /tmp/runtime-x86_64" \
            | sha256sum --check
      - name: Build AppImage
        if: matrix.target == 'linux'
        env:
          APPIMAGE_RUNTIME_FILE: /tmp/runtime-x86_64
        run: packaging/build_appimage.sh
      - name: Build portable ZIP
        if: matrix.target != 'linux'
        run: python packaging/build_portable.py
      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: SubFuse-${{ matrix.target }}-${{ runner.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Create checksums
        working-directory: release-assets
        run: sha256sum -- * > SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --verify-tag \
            --generate-notes \
            --title "SubFuse $GITHUB_REF_NAME"
